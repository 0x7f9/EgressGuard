[workspace]
resolver = "2"
members = [
    "shared",
    "backend",
    "frontend",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
tokio = { version = "1", default-features = false }
rusqlite = { version = "0.37", features = ["bundled"] }
maxminddb = "0.25"
flate2 = "1"
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-build = { version = "2", features = [] }
rfd = "0.15"
winreg = "0.55"
tauri-winrt-notification = "0.7"
windows-service = "0.8"
windows = "0.61"
getrandom = "0.2"
png = "0.17"

[profile.release]
debug = false
strip = true
panic = "abort"
lto = true
codegen-units = 1
opt-level = "z"
